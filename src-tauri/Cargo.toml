[package]
name = "rpgcreator-shell"
version = "0.5.0"
description = "RPGCreatorAI desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rpgcreator_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
once_cell = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
