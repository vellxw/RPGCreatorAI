name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor UI
        - Runtime
        - Data format
        - Assets
        - Tauri desktop shell
        - Documentation
        - AI-assisted authoring
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
